      <circle cx="0" cy="0" r="1.5" fill="#b7d8e8" fill-opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="28" fill="url(#grid)"/>
  <path d="M0 340 C240 300 340 370 560 330 S900 250 1120 300 S1390 355 1600 285" fill="none" stroke="#56d6c8" stroke-opacity=".13" stroke-width="2"/>
  <path d="M0 365 C230 325 380 390 600 350 S920 275 1120 325 S1390 380 1600 310" fill="none" stroke="#8ee4bc" stroke-opacity=".12" stroke-width="2"/>
