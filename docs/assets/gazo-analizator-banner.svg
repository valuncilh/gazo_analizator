      <stop offset="0.58" stop-color="#183653"/>
      <stop offset="1" stop-color="#0f5862"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56d6c8"/>
      <stop offset="1" stop-color="#8ee4bc"/>
