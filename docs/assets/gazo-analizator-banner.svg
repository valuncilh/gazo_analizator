<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Газо-анализатор метана — инженерный проект</title>
  <desc id="desc">Визуальная шапка документации проекта бытового сигнализатора утечки метана. Абстрактные линии измерительного сигнала и химическая формула CH4.</desc>
  <defs>
