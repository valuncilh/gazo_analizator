<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Карта прогресса проекта газоанализатора</title>
<desc id="desc">Дорожная карта P0-P7. Схема E3 утверждена. Подготовка footprints частично завершена. PCB E3, E4 и корпус ещё не начаты.</desc>
<defs>
  <style>
    .bg{fill:#f5f7fa}.title{font:700 28px sans-serif;fill:#182230}.sub{font:15px sans-serif;fill:#526174}
    .card{fill:#fff;stroke:#d6dde7;stroke-width:2}.done{stroke:#23835b}.partial{stroke:#c28a22}.todo{stroke:#8492a6}
    .h{font:700 17px sans-serif;fill:#182230}.body{font:14px sans-serif;fill:#526174}.status{font:700 12px sans-serif}
    .green{fill:#e5f4ec}.yellow{fill:#fff3d9}.gray{fill:#edf1f5}.link{stroke:#9aa8b8;stroke-width:3;fill:none}
  </style>
</defs>
<rect class="bg" width="1200" height="760"/>
<text x="48" y="52" class="title">Gazo Analizator — карта прогресса</text>
<text x="48" y="82" class="sub">Актуально на 02.11.2026 • analysis/vendor-behavioral-reconciliation • E3 неизменна</text>
<rect x="48" y="112" width="1104" height="62" rx="12" fill="#e9eef5"/>
<text x="70" y="138" class="h">Зафиксированная база</text>
<text x="70" y="159" class="body">E3: 19 компонентов • 15 сетей • 47 выводов | Joy-IT SEN-MQ4-V2 | 2 слоя | mixed SMD/THT | USB-C на отдельной E4</text>
<path class="link" d="M600 174 V205 H190 V230 M600 205 H1010 V230 M190 390 V420 H600 V445 M1010 390 V420 H600 M600 575 V600"/>
