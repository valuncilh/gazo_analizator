<title id="title">Э3 — функционально-связевая схема по утверждённому XML-netlist</title>
<desc id="desc">Визуальное представление утверждённой схемы газосигнализатора метана: сенсор Joy-IT SEN-MQ4-V2, входной каскад КТ3102Б, таймер NE555N, световая индикация, звуковой канал, вход питания XS1. Топология построена по XML-netlist утверждённой редакции Э3.</desc>
<metadata>Source KiCad: cad/project_modification/gost_e3_final/gazo_analizator_E3_GOST_itog.kicad_sch. Source XML-netlist SHA-256 not asserted; Git blob SHA: b24384b2e1b39068b3a11c9e11554cd4dc406b57. Approved baseline tag: gost-e3-approved-2026-11-01. This functional connection view is a documentation aid, not a substitute for the native KiCad schematic.</metadata>
