000" y="254.000" font-family="Arial, sans-serif" font-size="1.900" text-anchor="start" font-weight="normal" fill="#111">Масштаб: эскиз</text><text x="232.000" y="265.000" font-family="Arial, sans-serif" font-size="1.900" text-anchor="start" font-weight="normal" fill="#111">Разработал: __________________</text><text x="232.000" y="270.000" font-family="Arial, sans-serif" font-size="1.900" text-anchor="start" font-weight="normal" fill="#111">Проверил: ____________________</text><text x="232.000" y="274.000" font-family="Arial, sans-serif" font-size="1.900" text-anchor="start" font-weight="normal" fill="#111">Н.контр.: ____________________</text><text x="350.000" y="265.000" font-family="Arial, sans-serif" font-size="1.900" text-anchor="start" font-weight="normal" fill="#111">Дата: __.__.____</text><text x="377.000" y="265.000" font-family="Arial, sans-serif" font-size="1.900" text-anchor="start" font-weight="normal" fill="#111">Лист: 1</text><text x="397.000" y="265.000" font-family="Arial, sans-serif" font-size="1.900" text-anchor="start" font-weight="normal" fill="#111">Всего: 1</text><text x="232.000" y="280.000" font-family="Arial, sans-serif" font-size="1.900" text-anchor="start" font-weight="normal" fill="#922">Обозначение: СОГЛАСОВАТЬ</text><text x="232.000" y="284.000" font-family="Arial, sans-serif" font-size="1.900" text-anchor="start" font-weight="normal" fill="#922">Э3? — ВРЕМЕННОЕ</text><rect x="35.000" y="48.000" width="58.000" height="28.000" fill="none" stroke="#111" stroke-width="0.300"/><text x="64.000" y="58.000" font-family="Arial, sans-serif" font-size="3.000" text-anchor="middle" font-weight="bold" fill="#111">A1</text><text x="64.000" y="65.000" font-family="Arial, sans-serif" font-size="2.500" text-anchor="middle" font-weight="normal" fill="#111">MQ-4</text><rect x="114.000" y="48.000" width="50.000" height="28.000" fill="none" stroke="#111" stroke-width="0.300"/><text x="139.000" y="58.000" font-family="Arial, sans-serif" font-size="3.000" text-anchor="middle" font-weight="bold" fill="#111">U2</text><text x="139.000" y="65.000" font-family="Arial, sans-serif" font-size="2.500" text-anchor="middle" font-weight="normal" fill="#111">TLV7041-Q1</text><rect x="188.000" y="48.000" width="45.000" height="28.000" fill="none" stroke="#111" stroke-width="0.300"/><text x="210.500" y="58.000" font-family="Arial, sans-serif" font-size="3.000" text-anchor="middle" font-weight="bold" fill="#111">VT1</text><text x="210.500" y="65.000" font-family="Arial, sans-serif" font-size="2.500" text-anchor="middle" font-weight="normal" fill="#111">KT3102ГМ</text><rect x="254.000" y="48.000" width="52.000" height="28.000" fill="none" stroke="#111" stroke-width="0.300"/><text x="280.000" y="58.000" font-family="Arial, sans-serif" font-size="3.000" text-anchor="middle" font-weight="bold" fill="#111">DA1</text><text x="280.000" y="65.000" font-family="Arial, sans-serif" font-size="2.500" text-anchor="middle" font-weight="normal" fill="#111">КР1006ВИ1</text><rect x="330.000" y="48.000" width="60.000" height="28.000" fill="none" stroke="#111" stroke-width="0.300"/><text x="360.000" y="58.000" font-family="Arial, sans-serif" font-size="3.000" text-anchor="middle" font-weight="bold" fill="#111">HL1</text><text x="360.000" y="65.000" font-family="Arial, sans-serif" font-size="2.500" text-anchor="middle" font-weight="normal" fill="#111">R6 + LED</text><rect x="254.000" y="118.000" width="52.000" height="28.000" fill="none" stroke="#111" stroke-width="0.300"/><text x="280.000" y="128.000" font-family="Arial, sans-serif" font-size="3.000" text-anchor="middle" font-weight="bold" fill="#111">R9 + SA1</text><text x="280.000" y="135.000" font-family="Arial, sans-serif" font-size="2.500" text-anchor="middle" font-weight="normal" fill="#111">Звук</text><rect x="330.000" y="118.000" width="60.000" height="28.000" fill="none" stroke="#111" stroke-width="0.300"/><text x="360.000" y="128.000" font-family="Arial, sans-serif" font-size="3.000" text-anchor="middle" font-weight="bold" fill="#111">VT2 / HA1</text><text x="360.000" y="135.000" font-family="Arial, sans-serif" font-size="2.500" text-anchor="middle" font-weight="normal" fill="#111">HCM1205X</text><line x1="93.000" y1="62.000" x2="114.000" y2="62.000" stroke="#111" stroke-width="0.400"/><text x="103.000" y="59.000" font-family="Arial, sans-serif" font-size="2.500" text-anchor="middle" font-weight="normal" fill="#111">S</text><line x1="164.000" y1="62.000" x2="188.000" y2="62.000" stroke="#111" stroke-width="0.400"/><text x="176.000" y="59.000" font-family="Arial, sans-serif" font-size="2.500" text-anchor="middle" font-weight="normal" fill="#111">DOUT′</text><line x1="233.000" y1="62.000" x2="254.000" y2="62.000" stroke="#111" stroke-width="0.400"/><text x="243.000" y="59.000" font-family="Arial, sans-serif" font-size="2.300" text-anchor="middle" font-weight="normal" fill="#111">RESET</text><line x1="306.000" y1="62.000" x2="330.000" y2="62.000" stroke="#111" stroke-width="0.400"/><text x="318.000" y="59.000" font-family="Arial, sans-serif" font-size="2.500" text-anchor="middle" font-weight="normal" fill="#111">OUT</text><line x1="280.000" y1="76.000" x2="280.000" y2="102.000" stroke="#111" stroke-width="0.400"/><line x1="280.000" y1="102.000" x2="280.000" y2="118.000" stroke="#111" stroke-width="0.400"/><line x1="306.000" y1="132.000" x2="330.000" y2="132.000" stroke="#111" stroke-width="0.400"/><text x="318.000" y="129.000" font-family="Arial, sans-serif" font-size="2.200" text-anchor="middle" font-weight="normal" fill="#111">VT2 base</text><line x1="280.000" y1="102.000" x2="359.000" y2="102.000" stroke="#111" stroke-width="0.300" stroke-dasharray="4 2"/><line x1="359.000" y1="102.000" x2="359.000" y2="118.000" stroke="#111" stroke-width="0.300" stroke-dasharray="4 2"/><text x="40.000" y="91.000" font-family="Arial, sans-serif" font-size="2.800" text-anchor="start" font-weight="normal" fill="#111">S → U2 / порог и гистерезис → VT1 → RESET → таймер → сигнализация</text><text x="40.000" y="101.000" font-family="Arial, sans-serif" font-size="2.500" text-anchor="start" font-weight="normal" fill="#111">R1/R8 — подтяжка выхода. P1 формирует UREF. RHYS задаёт внешний гистерезис.</text><text x="40.000" y="159.000" font-family="Arial, sans-serif" font-size="2.700" text-anchor="start" font-weight="bold" fill="#922">Схема является функциональным эскизом по текущей расчётной модели, а не официальной Э3.</text><text x="40.000" y="166.000" font-family="Arial, sans-serif" font-size="2.400" text-anchor="start" font-weight="normal" fill="#111">Перед выпуском требуется проверить pin mapping, полярности, сетевые соединения и состав ПЭ3.</text><text x="40.000" y="173.000" font-family="Arial, sans-serif" font-size="2.400" text-anchor="start" font-weight="normal" fill="#111">Ток/модель A1, выводы DA1 и pinout VT1/VT2 должны соответствовать реальным исполнениям.</text></svg>