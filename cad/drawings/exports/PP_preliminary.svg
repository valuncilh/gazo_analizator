111">пока не проверены по завершённой схеме Э3.</text><text x="220.000" y="90.000" font-family="Arial, sans-serif" font-size="2.300" text-anchor="start" font-weight="bold" fill="#922">Не выпускать Gerber для производства.</text><text x="220.000" y="104.000" font-family="Arial, sans-serif" font-size="3.100" text-anchor="start" font-weight="bold" fill="#111">Критичные открытые вопросы</text><text x="220.000" y="111.000" font-family="Arial, sans-serif" font-size="2.300" text-anchor="start" font-weight="normal" fill="#111">• распиновка конкретного КТ3102ГМ для VT1/VT2</text><text x="220.000" y="117.000" font-family="Arial, sans-serif" font-size="2.300" text-anchor="start" font-weight="normal" fill="#111">• физический потенциометр P1, переключатель SA1</text><text x="220.000" y="123.000" font-family="Arial, sans-serif" font-size="2.300" text-anchor="start" font-weight="normal" fill="#111">• разъём XS1 и его ввод в корпус</text><text x="220.000" y="129.000" font-family="Arial, sans-serif" font-size="2.300" text-anchor="start" font-weight="normal" fill="#111">• корпуса и мощность пассивных компонентов</text><text x="220.000" y="135.000" font-family="Arial, sans-serif" font-size="2.300" text-anchor="start" font-weight="normal" fill="#111">• схема-to-PCB netlist, ERC и полный DRC</text><text x="36.000" y="179.000" font-family="Arial, sans-serif" font-size="2.400" text-anchor="start" font-weight="normal" fill="#111">Эскиз показывает расположение по preliminary KiCad PCB.</text><text x="36.000" y="184.000" font-family="Arial, sans-serif" font-size="2.400" text-anchor="start" font-weight="normal" fill="#111">Точные посадочные размеры и зазоры не подтверждены.</text></svg>