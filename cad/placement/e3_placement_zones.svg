<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
<rect width="1200" height="690" fill="#ffffff"/>
<text x="44" y="44" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#18212b">E3 — концептуальные зоны размещения</text>
<text x="44" y="72" font-family="Arial,sans-serif" font-size="14" fill="#596675">Не в масштабе. Геометрия платы и координаты компонентов не зафиксированы.</text>
<rect x="75" y="110" width="1050" height="500" rx="24" fill="#f8fafc" stroke="#243447" stroke-width="3"/>
<text x="90" y="135" font-family="Arial,sans-serif" font-size="13" fill="#64748b">ПРЕДВАРИТЕЛЬНАЯ ОСНОВНАЯ PCB E3 • 2 LAYERS • MIXED SMD/THT</text>
<!-- sensor connector -->
<rect x="100" y="235" width="160" height="100" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="180" y="261" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" font-weight="700" fill="#075985">A1 / SEN</text>
<text x="180" y="284" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#075985">PicoBlade 4p</text>
<text x="180" y="307" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#075985">remote cable</text>
<rect x="100" y="175" width="160" height="40" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="180" y="200" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="#92400e">A1 Joy-IT вне PCB</text>
<!-- input signal -->
<rect x="300" y="210" width="185" height="150" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="392" y="239" text-anchor="middle" font-size="16" font-family="Arial,sans-serif" font-weight="700" fill="#166534">Z1 • SENSOR</text>
<text x="392" y="267" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#166534">R1 / R2</text>
<text x="392" y="290" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#166534">VT1</text>
<text x="392" y="322" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#166534">DOUT → RESET</text>
<path d="M260 285 H300" stroke="#0369a1" stroke-width="3" fill="none"/>
<!-- timer -->
<rect x="545" y="170" width="240" height="240" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="665" y="199" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" font-weight="700" fill="#5b21b6">Z2 • TIMER CORE</text>
<rect x="625" y="222" width="80" height="60" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<text x="665" y="258" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" font-weight="700" fill="#5b21b6">DA1</text>
<text x="665" y="312" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#5b21b6">R4 / R5 / C1</text>
<text x="665" y="337" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#5b21b6">C2 at pin 5</text>
<text x="665" y="372" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#5b21b6">short timing loop</text>
<path d="M485 285 H545" stroke="#15803d" stroke-width="3" fill="none"/>
<!-- output -->
<rect x="845" y="165" width="235" height="150" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="962" y="194" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" font-weight="700" fill="#9a3412">Z4 • SOUND</text>
<text x="962" y="222" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#9a3412">VD1 → HA1</text>
<text x="962" y="247" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#9a3412">SA1 + C3 + R7</text>
<text x="962" y="280" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#9a3412">acoustic edge / port</text>
<path d="M785 250 H845" stroke="#6d28d9" stroke-width="3" fill="none"/>
<!-- LEDs -->
<rect x="845" y="355" width="235" height="105" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
<text x="962" y="383" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" font-weight="700" fill="#9d174d">Z3 • INDICATORS</text>
<text x="962" y="411" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#9d174d">HL1 + R6</text>
<text x="962" y="435" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#9d174d">HL2 + R7</text>
<!-- power -->
<rect x="100" y="455" width="190" height="95" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
<text x="195" y="483" text-anchor="middle" font-size="16" font-family="Arial,sans-serif" font-weight="700" fill="#334155">Z5 • XS1</text>
<text x="195" y="510" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#334155">PicoBlade 2p</text>
<text x="195" y="532" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#334155">E4 → +5V / Earth</text>
<rect x="100" y="565" width="190" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="195" y="584" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#475569">USB-C E4 — отдельная PCB</text>
<!-- notes -->
<rect x="350" y="455" width="730" height="125" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="375" y="483" font-size="15" font-weight="700" font-family="Arial,sans-serif" fill="#334155">Ключевые ограничения трассировки</text>
<text x="375" y="510" font-size="13" font-family="Arial,sans-serif" fill="#334155">• A1.2–R1/R2–VT1–RESET: короткий сигнальный тракт</text>
<text x="375" y="535" font-size="13" font-family="Arial,sans-serif" fill="#334155">• B.Cu: максимально непрерывный полигон Earth</text>
<text x="375" y="560" font-size="13" font-family="Arial,sans-serif" fill="#334155">• Net-(SA1-B) / C3.2 — отдельная сеть, не GND; AOUT — одиночный вывод</text>
<text x="600" y="645" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#64748b">Схема зон не является чертежом PCB, координатным placement или DRC-результатом.</text>
</svg>