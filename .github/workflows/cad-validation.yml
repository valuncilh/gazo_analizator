name: Preliminary CAD validation

on:
  pull_request:
    paths:
      - "cad/**"
      - "requirements/verification_matrix.md"
      - "requirements/project_checklist.md"
      - ".github/workflows/cad-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cad-validation-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  kicad-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install KiCad 9 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common python3
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad librsvg2-bin
          kicad-cli version
          python3 -c 'import pcbnew; print("KiCad pcbnew Python bindings ready")'

      - name: Install FreeRouting CLI 2.5.0
        run: |
          set -eu
          mkdir -p /tmp/freerouting
          curl -fL --retry 3 --retry-delay 2 https://github.com/freerouting/freerouting/releases/download/v2.5.0/freerouting-cli-2.5.0-linux-x64.tar.gz -o /tmp/freerouting-cli.tar.gz
          curl -fL --retry 3 --retry-delay 2 https://github.com/freerouting/freerouting/releases/download/v2.5.0/freerouting-cli-2.5.0-checksums.txt -o /tmp/freerouting-checksums.txt
          EXPECTED_SHA="$(awk '$2 == "freerouting-cli-2.5.0-linux-x64.tar.gz" {print $1}' /tmp/freerouting-checksums.txt)"
          test -n "$EXPECTED_SHA"
          echo "$EXPECTED_SHA  /tmp/freerouting-cli.tar.gz" | sha256sum -c -
          tar -xzf /tmp/freerouting-cli.tar.gz -C /tmp/freerouting
          ROUTER="$(find /tmp/freerouting -type f \( -name 'freeRouting' -o -name 'freerouting' -o -name 'freerouting-cli' \) -print -quit)"
          if [ -z "$ROUTER" ]; then ROUTER="$(find /tmp/freerouting -type f -perm /111 -print -quit)"; fi
          test -n "$ROUTER"
          chmod +x "$ROUTER"
          echo "FREEROUTING_BIN=$ROUTER" >> "$GITHUB_ENV"
          echo "FreeRouting executable: $ROUTER"
          "$ROUTER" --help > /tmp/freerouting-help.txt 2>&1 || true
          head -n 35 /tmp/freerouting-help.txt
      - name: Generate preliminary board and reports
        run: |
          set -eu
          python3 cad/scripts/generate_preliminary_pcb.py
          python3 cad/scripts/autoroute_preliminary_pcb.py
          python3 cad/scripts/check_preliminary_pcb.py
          python3 cad/scripts/test_electrical_trace.py
          python3 cad/drawings/generate_preliminary_drawings.py
          python3 cad/drawings/test_preliminary_drawings.py
          for SVG in cad/drawings/exports/*.svg; do rsvg-convert --output "${SVG%.svg}.png" "$SVG"; done
          test -s cad/drawings/exports/PP_preliminary.png
          test -s cad/drawings/exports/VO_preliminary.png

      - name: Parse board, collect DRC report and export SVG
        run: |
          set -eu
          mkdir -p cad/output/board_svg
          set +e
          kicad-cli pcb drc --severity-all --output cad/output/kicad_drc_report.rpt cad/kicad/gazo_analizator_preliminary.kicad_pcb > cad/output/kicad_drc_console.log 2>&1
          DRC_RC=$?
          set -e
          echo "KiCad DRC process exit code: $DRC_RC" | tee cad/output/kicad_environment.txt
          kicad-cli version >> cad/output/kicad_environment.txt 2>&1
          kicad-cli pcb export svg --mode-multi --output cad/output/board_svg --layers "F.Cu,F.SilkS,Edge.Cuts,Cmts.User" cad/kicad/gazo_analizator_preliminary.kicad_pcb
          test -s cad/output/kicad_drc_report.rpt
          if [ "$DRC_RC" -ne 0 ] || grep -Eq 'Found [1-9][0-9]* violations|Found [1-9][0-9]* unconnected items' cad/output/kicad_drc_console.log; then
            echo "ROUTING_ACCEPTED=false" >> "$GITHUB_ENV"
            echo "Autoroute remains incomplete or DRC is not clean. Candidate will be uploaded for review but not pushed to the branch."
            printf '%s\n' "Routing acceptance: NOT ACCEPTED. Review DRC and unconnected items." >> cad/output/preliminary_cad_summary.md
          else
            echo "ROUTING_ACCEPTED=true" >> "$GITHUB_ENV"
            printf '%s\n' "Routing acceptance: DRC found no geometric violations or unconnected items. Manual layout review remains mandatory." >> cad/output/preliminary_cad_summary.md
          fi
          test -n "$(find cad/output/board_svg -type f -name '*.svg' -print -quit)"
          cat cad/output/kicad_drc_console.log

      - name: Commit generated board to same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && env.ROUTING_ACCEPTED == 'true'
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -eu
          mkdir -p /tmp/generated-pcb
          cp cad/kicad/gazo_analizator_preliminary.kicad_pcb /tmp/generated-pcb/
          cp cad/kicad/fp-lib-table /tmp/generated-pcb/
          cp -a cad/kicad/footprints /tmp/generated-pcb/
          mkdir -p /tmp/generated-pcb/drawings
          cp cad/drawings/exports/* /tmp/generated-pcb/drawings/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$PR_BRANCH"
          git checkout --force -B "$PR_BRANCH" "origin/$PR_BRANCH"
          cp /tmp/generated-pcb/gazo_analizator_preliminary.kicad_pcb cad/kicad/
          cp /tmp/generated-pcb/fp-lib-table cad/kicad/
          mkdir -p cad/kicad/footprints
          cp -a /tmp/generated-pcb/footprints/GazoPreliminary.pretty cad/kicad/footprints/
          mkdir -p cad/drawings/exports
          cp /tmp/generated-pcb/drawings/* cad/drawings/exports/
          git add cad/kicad/gazo_analizator_preliminary.kicad_pcb cad/kicad/fp-lib-table cad/kicad/footprints/GazoPreliminary.pretty cad/drawings/exports
          if git diff --cached --quiet; then
            echo "Generated KiCad board already matches the PR branch."
          else
            git commit -m "cad: add generated preliminary KiCad board [skip ci]"
            git push origin "HEAD:$PR_BRANCH"
          fi

      - name: Upload KiCad validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gazo-preliminary-kicad
          if-no-files-found: warn
          path: |
            cad/kicad/*.kicad_pcb
            cad/kicad/*.kicad_pro
            cad/kicad/fp-lib-table
            cad/kicad/footprints/GazoPreliminary.pretty/*.kicad_mod
            cad/drawings/exports/**
            cad/output/**

  freecad-model:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install FreeCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common xvfb
          sudo add-apt-repository -y ppa:freecad-maintainers/freecad-stable
          sudo apt-get update
          sudo apt-get install -y freecad
          find /usr -type f \( -iname 'freecadcmd' -o -iname 'freecadcmd*' \) -print

      - name: Build parametric enclosure and export STEP/STL
        run: |
          set -euo pipefail
          mkdir -p cad/output
          FCMD="$(command -v freecadcmd || command -v FreeCADCmd || true)"
          if [ -z "$FCMD" ]; then
            FCMD="$(find /usr -type f \( -iname 'freecadcmd' -o -iname 'FreeCADCmd' \) -print -quit)"
          fi
          if [ -n "$FCMD" ]; then
            "$FCMD" cad/freecad/build_enclosure.FCMacro 2>&1 | tee cad/output/freecad_build.log
          else
            timeout 180s xvfb-run -a freecad cad/freecad/build_enclosure.FCMacro 2>&1 | tee cad/output/freecad_build.log
          fi
          test -s cad/output/gazo_enclosure_preliminary.FCStd
          test -s cad/output/case_base_preliminary.step
          test -s cad/output/lid_preliminary.step
          test -s cad/output/gazo_preliminary_assembly.step
          test -s cad/output/case_base_preliminary.stl
          test -s cad/output/lid_preliminary.stl
          python3 -m json.tool cad/output/enclosure_build_report.json > /dev/null

      - name: Upload FreeCAD exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gazo-preliminary-freecad
          if-no-files-found: warn
          path: |
            cad/output/*.FCStd
            cad/output/*.step
            cad/output/*.stl
            cad/output/enclosure_build_report.json
            cad/output/freecad_build.log
