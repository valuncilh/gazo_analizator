name: SPICE behavioral model smoke test

on:
  push:
    paths:
      - "spice/**"
      - ".github/workflows/spice-validation.yml"
  pull_request:
    paths:
      - "spice/**"
      - ".github/workflows/spice-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ngspice-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ngspice and plotting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice python3-numpy python3-matplotlib curl unzip
          ngspice --version

      - name: Probe official TI SPICE model archives
        run: sh spice/fetch_vendor_models.sh

      - name: Test downloaded TI model compatibility with ngspice
        continue-on-error: true
        run: sh spice/run_vendor_model_test.sh

      - name: Run 4.7 uF and 47 uF timer scenarios
        run: sh spice/run_comparison.sh

      - name: Run AC analysis and create Bode plots
        run: |
          set -o pipefail
          ngspice -b spice/sensor_bode.cir 2>&1 | tee spice/bode_ngspice.log
          test -s spice/bode_results.dat
          python3 -m py_compile spice/plot_bode.py
          python3 spice/plot_bode.py

      - name: Upload simulation output and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngspice-smoke-test-output
          if-no-files-found: warn
          path: |
            spice/ngspice.log
            spice/ngspice_47u.log
            spice/spice_chain_results.dat
            spice/spice_chain_results_4p7u.dat
            spice/spice_chain_results_47u.dat
            spice/spice_chain_plots.png
            spice/bode_ngspice.log
            spice/bode_results.dat
            spice/bode_linearized.png
            spice/vendor_model_probe.log
            spice/vendor_model_test.log
            spice/vendor_model_results.dat
