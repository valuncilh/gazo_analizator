name: SPICE behavioral model smoke test

concurrency:
  group: spice-validation-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "spice/**"
      - "docs/figures/**"
      - ".github/workflows/spice-validation.yml"
  pull_request:
    paths:
      - "spice/**"
      - ".github/workflows/spice-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ngspice-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ngspice and plotting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice python3-numpy python3-matplotlib curl unzip xschem xvfb
          ngspice --version

      - name: Fetch source schematic reference once
        run: |
          mkdir -p docs/figures
          if [ ! -s docs/figures/source_schematic.webp ]; then
            curl --fail --location --silent --show-error --retry 2 \
              "https://www.radioradar.net/storage/files/Image/radiofan/home_appliances/household_gas_leak_detector/pic1.webp" \
              -o docs/figures/source_schematic.webp
          fi

      - name: Probe official TI SPICE model archives
        run: sh spice/fetch_vendor_models.sh

      - name: Test downloaded TI model compatibility with ngspice
        run: sh spice/run_vendor_model_test.sh

      - name: Run 4.7 uF and 47 uF timer scenarios
        run: sh spice/run_comparison.sh

      - name: Run AC analysis and create Bode plots
        run: |
          set -o pipefail
          ngspice -b spice/sensor_bode.cir 2>&1 | tee spice/bode_ngspice.log
          test -s spice/bode_results.dat
          python3 -m py_compile spice/plot_bode.py
          python3 spice/plot_bode.py

      - name: Evaluate xschem MQ-4 divider fragment
        run: sh spice/test_xschem_probe.sh

      - name: Generate annotated PNG figures
        run: |
          python3 docs/figures/generate_figures.py

      - name: Commit regenerated PNGs to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -eu
          mkdir -p /tmp/generated-figures
          cp docs/figures/fig*.png /tmp/generated-figures/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$PR_BRANCH"
          git checkout --force -B "$PR_BRANCH" "origin/$PR_BRANCH"
          cp /tmp/generated-figures/fig*.png docs/figures/
          git add docs/figures/fig*.png
          if git diff --cached --quiet; then
            echo "Generated figures already match the PR branch."
            exit 0
          fi
          git commit -m "Обновить PNG рисунков 0–8 [skip ci]"
          git push origin "HEAD:$PR_BRANCH"

      - name: Upload simulation output and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngspice-smoke-test-output
          if-no-files-found: warn
          path: |
            spice/ngspice.log
            spice/ngspice_47u.log
            spice/spice_chain_results.dat
            spice/spice_chain_results_4p7u.dat
            spice/spice_chain_results_47u.dat
            spice/spice_chain_plots.png
            spice/bode_ngspice.log
            spice/bode_results.dat
            spice/bode_linearized.png
            spice/vendor_model_probe.log
            spice/vendor_model_test.log
            spice/vendor_model_results.dat
            spice/vendor_model_sound_off.log
            spice/vendor_model_results_sound_off.dat
            spice/vendor_chain_plots.png
            spice/xschem_probe/*
            docs/figures/*.png
            docs/figures/xschem_probe/*.png
